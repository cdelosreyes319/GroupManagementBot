name: Deployment to AWS EC2 instance
run-name: production CD
on:
    workflow_run:
        workflows: ["Run Tests for Production"]
        types:
            - completed

jobs:
  deploy:
    # Only deploy when CI succeeded AND it ran on a release/* branch. This stops
    # pull-request CI runs (which use the same workflow) from triggering a
    # production deploy.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          startsWith(github.event.workflow_run.head_branch, 'release/') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Use Node.js v24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Build release
        run: |
            npm ci --ignore-scripts
            npm run build

      # Basic sanity check that the build produced a non-trivial bundle before we
      # take production offline. Fails the deploy early if the build is broken.
      - name: Verify build output
        run: |
            test -f dist/main.js
            test "$(wc -c < dist/main.js)" -gt 1000

      - name: Bring production offline for deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
                if pm2 list | grep -q GroupManagementBot; then
                  pm2 stop GroupManagementBot
                fi

      - name: Deploy release to production
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "dist/,package.json,package-lock.json,.env.ci"
          target: "/home/ubuntu/prod-GroupManagementBot"

      - name: Update production dependencies
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
                cd /home/ubuntu/prod-GroupManagementBot
                npm ci --omit=dev --ignore-scripts

  start:
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Bring production online
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
                set -e
                cd /home/ubuntu/prod-GroupManagementBot

                if pm2 list | grep -q GroupManagementBot; then
                    echo "Restarting existing app..."
                    # --update-env re-reads the environment (incl. the dotenvx key)
                    # so a restart never runs with a stale or missing key.
                    DOTENV_PRIVATE_KEY_CI="${{ secrets.DOTENV_PRIVATE_KEY_CI }}" \
                    npx dotenvx run -- pm2 restart GroupManagementBot --update-env
                else
                    echo "Starting app for the first time..."
                    DOTENV_PRIVATE_KEY_CI="${{ secrets.DOTENV_PRIVATE_KEY_CI }}" \
                    npx dotenvx run -- pm2 start dist/main.js --name GroupManagementBot
                fi

                # Persist the current process list on every deploy so a reboot
                # resurrects the latest config (not just on first start).
                pm2 save

                # Confirm the process actually came up online, not errored. The
                # status is read from pm2's JSON output by parsing it with node,
                # which is more reliable than grepping the raw JSON string.
                sleep 5
                STATUS=$(pm2 jlist | node -e "const list=JSON.parse(require('fs').readFileSync(0,'utf8')); const p=list.find(x=>x.name==='GroupManagementBot'); process.stdout.write(p ? p.pm2_env.status : 'missing')")
                echo "GroupManagementBot status: $STATUS"
                if [ "$STATUS" != "online" ]; then
                    echo "::error::GroupManagementBot did not come online (status: $STATUS)"
                    pm2 logs GroupManagementBot --lines 30 --nostream || true
                    exit 1
                fi
