name: Deployment to AWS EC2 instance
run-name: production CD
on:
    workflow_run:
        workflows: ["Run Tests for Production"]
        types:
            - completed


jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      
      - name: Deploy release to staging environment
        run: |
            npm ci
            npm run build
      
      # TODO: add staging tests

      - name: Bring production offline for deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
                pm2 stop GroupManagementBot

      - name: Deploy release to production
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: |
                dist/
                package.json
                package-lock.json
                .env.ci
          target: "/home/ubuntu/prod-GroupManagementBot"
          rm: true
      
      - name: Update production dependencies
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
                npm ci --omit=dev
    
  start:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    needs: deploy
    
    steps:
      - name: Bring production online
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
                cd /home/ubuntu/prod-GroupManagementBot
                if pm2 list | grep -q GroupManagementBot; then
                    echo "Restarting existing app..."
                    pm2 restart GroupManagementBot
                else
                    echo "Starting app for the first time..."
                    DOTENV_PRIVATE_KEY_CI="${{ secrets.DOTENV_PRIVATE_KEY_CI }}" \
                    npx dotenvx run -- pm2 start dist/main.js --name GroupManagementBot
                    pm2 save
                fi
