name: Deployment to AWS EC2 instance
run-name: production CD
on:
    workflow_run:
        workflows: ["Run Tests for Production"]
        types:
            - completed


jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies and production build
        run: |
            npm ci
            npm run build

      - name: Upload release to remote
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "dist/*,.env"
          target: "/home/ubuntu/prod-GroupManagementBot"
    
  start:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    needs: deploy
    
    steps:
      - name: Restart app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
                cd /home/ubuntu/prod-GroupManagementBot
                if pm2 list | grep -q GroupManagementBot; then
                    echo "Restarting existing app..."
                    pm2 restart myapp
                else
                    echo "Starting app for the first time..."
                    pm2 start dist/index.js --name GroupManagementBot
                fi
