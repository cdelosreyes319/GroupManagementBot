name: Run Tests for Production
run-name: production CI
on:
  # release/** branches are the versioned release lines (e.g. release/v1). A push
  # to one runs CI and, on success, triggers CD (see cd.yml) to auto-deploy.
  push:
    branches:
      - 'release/**'
  # Also run CI on pull requests as a safety check. PR runs never trigger CD.
  pull_request:

jobs:
  Unit-Tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Use Node.js v24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        # --ignore-scripts skips noblox.js's decorative postinstall banner, which
        # crashes on a missing figlet font and is not needed at runtime.
        run: npm ci --ignore-scripts
      - name: Type check
        run: npm run typecheck
      - name: Run Tests
        run: npm run tests
        env:
          DOTENV_PRIVATE_KEY_CI: ${{ secrets.DOTENV_PRIVATE_KEY_CI }}